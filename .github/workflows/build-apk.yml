name: Gerar APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Montar projeto
        run: |
          mkdir www
          cp index.html sw.js manifest.webmanifest icon-192.png icon-512.png www/
          npm init -y
          npm i pdfjs-dist@3.11.174 pdf-lib@1.17.1 @capacitor/core@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          npm i -D @capacitor/cli@6
          mkdir www/libs
          cp node_modules/pdfjs-dist/build/pdf.min.js node_modules/pdfjs-dist/build/pdf.worker.min.js node_modules/pdf-lib/dist/pdf-lib.min.js www/libs/
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/#libs/#g; s#https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/#libs/#g' www/index.html
          npx cap init "Assinar PDF" br.com.assinarpdf --web-dir=www
          npx cap add android
          npx cap sync android
      - name: Compilar
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: assinar-pdf-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
